services:
  api:
    build: .
    container_name: kodie_faq_api
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - kodie_network

  n8n:
    image: n8nio/n8n:latest
    container_name: kodie_n8n
    ports:
      - "5679:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5679/
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - kodie_network

volumes:
  n8n_data:

networks:
  kodie_network:
    driver: bridge